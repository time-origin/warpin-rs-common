[workspace]
resolver = "2"
members = [
    "warpin-integrity",
    "warpin-types",
    "warpin-errors",
    "warpin-config",
    "warpin-http",
    "warpin-grpc",
    "warpin-auth",
    "warpin-context",
    "warpin-observability",
    "warpin-storage",
    "warpin-workspace",
    "warpin-object-storage",
    "warpin-event-bus",
    "warpin-capability",
    "warpin-dingtalk",
    "warpin-transport",
    "warpin-mqtt",
    "warpin-modbus",
]

[workspace.package]
edition = "2024"
version = "0.2.11"
license = "MIT"
authors = ["Warpin Engineering <dev@warpin.io>"]
repository = "https://github.com/time-origin/warpin-rs-common"

[workspace.dependencies]
# ── 异步运行时 ──
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3.32"
async-trait = "0.1.89"

# ── HTTP / Web ──
axum = "0.8.8"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "cors", "fs"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
humantime = "2.4.0"

# ── gRPC ──
tonic = "0.14.5"

# ── 序列化 ──
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_jcs = "=0.2.0"
sha2 = "0.10.9"
hex = "0.4.3"
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
zeroize = "1.8.2"

# ── 错误处理 ──
anyhow = "1.0.104"
thiserror = "2.0.18"

# ── 可观测性 ──
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# ── 数据库 ──
sea-orm = { version = "2.0.0-rc.36", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }

# ── API 文档 ──
utoipa = { version = "5.4", features = ["axum_extras", "chrono", "uuid"] }

# ── 基础类型 ──
uuid = { version = "1.22.0", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
bytes = "1"
url = "2.5.8"
# 0.14.2 fixes XML parser advisories; the managed-S3 adapter materializes URI
# authority as Host before its existing strict SigV4 verification.
object_store = { version = "=0.14.2", default-features = false }

# ── 消息队列 ──
rdkafka = { version = "0.39.0", features = ["tokio"] }

# ── JWT ──
jsonwebtoken = "9.3"

# ── 配置 ──
config = "0.15.19"

# ── Workspace 内部互依赖 ──
warpin-types  = { path = "warpin-types",  version = "0.2.11" }
warpin-errors = { path = "warpin-errors", version = "0.2.11" }
warpin-config = { path = "warpin-config", version = "0.2.11" }
warpin-dingtalk = { path = "warpin-dingtalk", version = "0.2.11" }
warpin-integrity = { path = "warpin-integrity", version = "0.2.11" }
warpin-storage = { path = "warpin-storage", version = "0.2.11" }

# Protocol adapters retain their distinct delivery semantics.
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
tokio-modbus = "0.17.0"
tokio-serial = "5.5.0"
tokio-rustls = "0.26.4"
rustls = "0.23.46"

warpin-transport = { path = "warpin-transport", version = "0.2.11" }

native-tls = "0.2.18"

tempfile = "3.27.0"
