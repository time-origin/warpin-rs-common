[package]
name = "warpin-object-storage"
version = "0.2.13"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Immutable, digest-verified object storage boundary for the Warpin framework"
readme = "README.md"
keywords = ["object-storage", "s3", "integrity", "immutable"]
categories = ["filesystem", "web-programming"]
include = [
    "src/**",
    "tests/**",
    "scripts/**",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "MIGRATION.md",
]

[features]
streaming = ["dep:tokio", "dep:async-trait", "dep:serde", "dep:serde_json", "dep:sha2"]
references = ["dep:serde"]
default = ["fs"]
fs = ["object_store/fs", "dep:tokio"]
aws = ["object_store/aws", "dep:async-trait", "dep:humantime", "dep:reqwest"]
obs = ["dep:async-trait", "dep:reqwest", "reqwest/stream", "dep:base64", "dep:hmac", "dep:sha1", "dep:httpdate", "dep:chrono", "dep:percent-encoding"]

[dependencies]
futures.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
bytes.workspace = true
humantime = { workspace = true, optional = true }
object_store.workspace = true
reqwest = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
url.workspace = true
warpin-integrity.workspace = true
base64 = { version = "0.22.1", optional = true }
hmac = { version = "0.13.0", optional = true }
sha1 = { version = "0.11.0", optional = true }
httpdate = { version = "1.0.3", optional = true }
chrono = { workspace = true, optional = true }
percent-encoding = { version = "2.3.2", optional = true }

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
