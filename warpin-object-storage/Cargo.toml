[package]
name = "warpin-object-storage"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Immutable, digest-verified object storage boundary for the Warpin framework"
keywords = ["object-storage", "s3", "integrity", "immutable"]
categories = ["filesystem", "web-programming"]
include = ["src/**", "Cargo.toml", "LICENSE"]

[features]
default = ["fs"]
fs = ["object_store/fs"]
aws = ["object_store/aws", "dep:async-trait"]

[dependencies]
async-trait = { workspace = true, optional = true }
bytes.workspace = true
object_store.workspace = true
thiserror.workspace = true
url.workspace = true
warpin-integrity.workspace = true

[dev-dependencies]
tokio.workspace = true
