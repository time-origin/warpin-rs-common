[package]
name = "warpin-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tracing, observability, and audit infrastructure for the Warpin framework"

[features]
default = ["tracing-init"]
tracing-init = []
audit-layer = ["dep:serde", "dep:serde_json", "dep:metrics", "dep:tokio", "dep:chrono"]
redaction = ["dep:serde", "dep:serde_json", "dep:regex"]
event-bus-sink = ["audit-layer", "redaction", "dep:async-trait", "dep:anyhow"]
full = ["tracing-init", "audit-layer", "redaction", "event-bus-sink"]

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true

# Optional deps for audit features
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
metrics = { version = "0.24", optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "rt"] }
async-trait = { workspace = true, optional = true }
regex = { version = "1", optional = true }
chrono = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
